<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkBuddy · 电话物料展示</title>
<style>
:root{font-family:"Microsoft YaHei",sans-serif;color:#17332d;background:#f4f6f3;color-scheme:light}*{box-sizing:border-box}body{margin:0}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #dce5df;background:white}header strong{font-size:25px}header span{margin-left:15px;color:#6b7973;font-size:14px}.online{font-size:14px;color:#168263}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:calc(100dvh - 76px)}.workflow{overflow:auto;padding:30px clamp(20px,3vw,52px)}.eyebrow{font-size:13px;color:#75867e;margin:0 0 12px}h1{font-size:clamp(25px,2.3vw,40px);line-height:1.3;margin:0 0 12px}.status{display:flex;align-items:center;gap:10px;font-size:15px;color:#317a63}.dot{width:9px;height:9px;border-radius:50%;background:#24ac7b}.recording .dot{background:#e46d3a;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}.spoken{margin:28px 0;padding:26px;border:1px solid #dce5df;border-radius:18px;background:white}.spoken p{font-size:clamp(23px,2.1vw,36px);line-height:1.7;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.muted{font-size:13px;color:#6c8075}.steps{display:flex;gap:7px;margin:25px 0}.step{flex:1;padding:11px 4px;text-align:center;border-top:3px solid #dce4de;font-size:13px;color:#84958b}.step.done{border-color:#2f9873;color:#247659}.step.active{border-color:#e89949;color:#925617;background:#faf1df}.progress{font-size:18px;min-height:58px;white-space:pre-wrap;line-height:1.6}.outputs{display:grid;gap:8px;margin:20px 0}.outputs p{margin:0;padding:13px 16px;background:#e7eee8;border-radius:10px;font-size:14px;overflow-wrap:anywhere}details{margin:22px 0;color:#5b7165;font-size:13px}summary{cursor:pointer}details p{padding:8px 0;border-bottom:1px solid #dde6df;white-space:pre-wrap}footer{margin-top:25px;font-size:12px;color:#8a988e}.art{background:#e7ebe5;border-left:1px solid #d6ded6;display:flex;flex-direction:column;padding:22px 24px;min-height:0;overflow:hidden}.art-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}.art-head strong{font-size:17px}.tabs{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #bfcec4;border-radius:8px;background:transparent;padding:7px 12px;color:#355a47;cursor:pointer;font:inherit;font-size:13px}button[aria-pressed=true]{background:#174f3a;color:white;border-color:#174f3a}.frame{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}#artwork{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}#artwork[hidden]{display:none}#empty{padding:36px;text-align:center;color:#6f8577;line-height:2}#caption{font-size:12px;color:#5d7567;margin-top:14px;min-height:20px}.error{color:#b54c37}.connection{color:#b54c37}.waiting{opacity:.75}@media(max-width:760px){header{padding:0 18px}header strong{font-size:20px}header span{display:none}.workflow{padding:20px 16px}.art{padding:16px 12px}.spoken{padding:16px}.spoken p{font-size:22px}.steps{flex-wrap:wrap}.step{min-width:38%}}@media(max-width:480px){main{grid-template-columns:1fr;height:auto}.art{height:80vh}.workflow{overflow:visible}}
</style></head><body>
<header><div><strong>WorkBuddy</strong><span>电话生成价格牌与海报</span></div><div id="connection" class="online">正在连接</div></header>
<main><section class="workflow" aria-label="电话识别与生成进度">
<p class="eyebrow">拿起电话，说出你的需求</p><h1 id="headline">正在连接电话服务</h1><div class="status" id="phoneStatus"><i class="dot"></i><span id="statusText">等待连接</span></div>
<div class="spoken"><div class="eyebrow" id="spokenLabel">最近一次识别</div><p id="transcript">例如：苹果每斤二十元，帮我做一张价格牌。</p><span class="muted" id="recordMeta">说完后放下听筒</span></div>
<div class="steps"><div class="step" id="step0">① 语音识别</div><div class="step" id="step1">② 整理需求</div><div class="step" id="step2">③ 生成图片</div><div class="step" id="step3">④ 响铃与打印</div></div>
<div id="progress" class="progress" aria-live="polite">等你打来第一通电话</div>
<div class="outputs"><p id="ring">电话提醒：等待生成完成</p><p id="printing">A4 彩色双面 · 正反同图</p></div>
<details><summary>本地运行记录</summary><div id="history"></div></details>
<footer>识别文字与图片均保存在本机 · 商品、价格、单位请核对口述内容</footer>
</section><section class="art" aria-label="最新生成图片">
<div class="art-head"><strong id="artTitle">最新作品</strong><div class="tabs" id="imageTabs"></div></div>
<div class="frame"><img id="artwork" alt="最新生成的物料图片" hidden><div id="empty">在这里查看生成的价格牌或海报<br>图片完成后将自动放大展示</div></div><div id="caption"></div>
</section></main>
<script>
const $=id=>document.getElementById(id);let displayedId='',selected=0,files=[],historySignature='';
const stages={understanding:'正在整理需求',generating_background:'正在生成海报底图',rendering:'正在排版',verifying:'正在核对图片',completed:'图片已生成',needs_input:'需要补充信息',failed:'生成失败'};
const states={prepared:'等待提交 WorkBuddy',sending:'正在提交给 WorkBuddy',waiting_desktop:'等待 WorkBuddy 输入',submitted:'WorkBuddy 正在生成',completed:'图片已生成',needs_input:'需要补充信息',failed:'生成失败',timed_out:'生成超时，等待处理结果',submission_unknown:'提交结果需要核对'};
function imageLabel(file,index){return (file.kind==='poster'?'海报':'价格牌')+(files.filter(f=>f.kind===file.kind).length>1?' '+(index+1):'');}
function showImage(){const file=files[selected];if(!file)return;const image=$('artwork');if(image.getAttribute('src')!==file.url){image.hidden=true;$('empty').hidden=false;$('empty').textContent='正在加载图片';image.src=file.url;}image.alt=imageLabel(file,selected);[...$('imageTabs').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===selected));}
$('artwork').onload=()=>{$('artwork').hidden=false;$('empty').hidden=true;};
$('artwork').onerror=()=>{$('artwork').hidden=true;$('empty').hidden=false;$('empty').textContent='图片暂未加载，请检查本地服务';};
function render(s){
 const tasks=s.pipeline?.tasks||[],task=tasks[0],record=s.history?.[0];const busy=['recording','transcribing'].includes(s.phase);
 $('connection').textContent=s.bridge_alive?'电话已连接':'电话监听未就绪';$('connection').className=s.bridge_alive?'online':'connection';
 $('headline').textContent=s.phase==='recording'?'正在听，请说出需求':s.phase==='transcribing'?'已挂机，正在识别':s.phase==='loading'?'正在准备语音模型':s.phase==='error'?'电话服务需要处理':'拿起电话，即可开始';
 $('statusText').textContent=s.message||'';$('phoneStatus').className='status '+(s.phase==='recording'?'recording':'');
 $('spokenLabel').textContent=busy?'上一轮识别 · 本轮录音结束后更新':'最近一次识别';
 $('transcript').textContent=record?.text||record?.error||'说出店名、商品、价格和单位。';
 $('recordMeta').textContent=record?new Date(record.time).toLocaleTimeString('zh-CN')+' · 录音 '+record.seconds.toFixed(1)+' 秒 · 已保存到本地':'说完后放下听筒';
 const waiting=['prepared','sending','waiting_desktop','submission_unknown'].includes(task?.state);
 const done=task?.state==='completed';let step=busy?0:done?3:waiting?1:task?.progress?.stage==='understanding'?1:task?2:-1;
 for(let i=0;i<4;i++)$('step'+i).className='step'+(i<step||(done&&i===3)?' done':i===step?' active':'');
 $('progress').textContent=busy?(s.phase==='recording'?'请说完后正常挂机':'正在将本轮录音转成文字'):task?(done?'图片已生成\n可在右侧查看完整作品。':task.state==='needs_input'?(task.questions||[]).join('；'):(stages[task.progress?.stage]||states[task.state]||'处理中')):'识别后会自动调用 market-stall-demo 生成图片';
 $('ring').textContent='电话提醒：'+(task?.notification?.message||'图片生成后响铃');
 $('printing').textContent=task?.printing?.state==='spooled'?'已提交打印 · A4 彩色双面 · 请在打印机取纸':task?.printing?.message||'A4 彩色双面 · 正反同图';
 const completed=tasks.find(t=>t.state==='completed'&&t.files?.length);
 if(completed){
   const next=JSON.stringify(completed.files);if(displayedId!==completed.id||JSON.stringify(files)!==next){displayedId=completed.id;files=completed.files;selected=0;$('imageTabs').replaceChildren();files.forEach((f,i)=>{const b=document.createElement('button');b.textContent=imageLabel(f,i);b.onclick=()=>{selected=i;showImage();};$('imageTabs').append(b);});}
   showImage();const previous=busy||completed.id!==task?.id;$('artTitle').textContent=previous?'上一轮作品 · 等待新图':'最新生成作品';
   $('caption').textContent=(previous?'当前显示上一轮成品。':'')+new Date(completed.created_at).toLocaleString('zh-CN')+' · '+(selected+1)+' / '+files.length+' · 原图等比例展示';
 }
 const sig=JSON.stringify((s.history||[]).slice(0,5));if(sig!==historySignature){historySignature=sig;$('history').replaceChildren();for(const h of (s.history||[]).slice(0,5)){const p=document.createElement('p');p.textContent=new Date(h.time).toLocaleTimeString('zh-CN')+' '+(h.text||h.error||'未识别到文字');$('history').append(p);}}
}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error(r.status);render(await r.json());}catch{$('connection').className='connection';$('connection').textContent='本地服务连接中断';}finally{setTimeout(poll,1000);}}poll();
</script></body></html>
